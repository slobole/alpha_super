{# Top bar: sticky, polled every 5 seconds via HTMX to refresh the verdict.
   Navigation lives in the side rail; this strip carries the LIVE|BENCH
   product toggle and the verdict — state, not wayfinding. #}
<header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-ink-100">
  <div class="max-w-[1480px] mx-auto px-6 h-14 flex items-center justify-between gap-4">
    <div class="flex border border-ink-100">
      <span class="px-4 py-1.5 font-mono text-xs tracking-wider text-accent border-b-2 border-accent font-medium">LIVE</span>
      <a href="{{ bench_url_str }}"
         class="px-4 py-1.5 font-mono text-xs tracking-wider text-ink-500 hover:text-ink-900">BENCH</a>
    </div>

    <div id="top-bar-verdict"
         hx-get="/fragments/top-bar"
         hx-trigger="load, every 5s"
         hx-swap="innerHTML">
      {% include "_top_bar_verdict.html" %}
    </div>
  </div>
</header>
