{# Top bar: LIVE identity, canonical XNYS market status and the live verdict. #}
<header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-ink-100">
  <div class="max-w-[1480px] mx-auto px-6 h-14 flex items-center justify-between gap-4">
    <span class="font-mono text-xs tracking-wider text-accent font-medium">LIVE</span>

    <div id="top-bar-verdict"
         hx-get="/fragments/top-bar{% if mode_str %}?mode={{ mode_str }}{% endif %}"
         hx-trigger="load, every 5s"
         hx-swap="innerHTML">
      {% include "_top_bar_verdict.html" %}
    </div>
  </div>
</header>
