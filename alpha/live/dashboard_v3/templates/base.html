<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <title>Alpha Ops · {% block title %}Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
  <script>
    /* Semantic slots only — hues come from the desk palette in
       alpha/engine/theme.py so LIVE and BENCH read as one product.
       The slot names (ok/warn/bad) keep their meaning; only hues moved. */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 900: '#16181d', 700: '#334155', 500: '#64748b', 300: '#cbd5e1', 100: '#e2e8f0', 50: '#f8fafc' },
            ok:   { DEFAULT: '#15803d', soft: '#f0fdf4' },
            warn: { DEFAULT: '#d97706', soft: '#fffbeb' },
            bad:  { DEFAULT: '#dc2626', soft: '#fef2f2' },
            mute: { DEFAULT: '#64748b', soft: '#f8fafc' },
            accent: { DEFAULT: '#2563eb', soft: '#eff6ff' },
          },
          fontFamily: {
            sans: ['IBM Plex Sans', 'Segoe UI', 'system-ui', 'sans-serif'],
            mono: ['IBM Plex Mono', 'Cascadia Mono', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white text-ink-900 min-h-screen font-sans">
  <div class="flex min-h-screen">
    {% include "_side_rail.html" %}
    <div class="flex-1 min-w-0">
      {% include "_top_bar.html" %}

      <div class="max-w-[1480px] mx-auto px-6 pt-3 grid gap-3"
           id="status-strip">
        <div id="health-strip"
             hx-get="/fragments/health-strip"
             hx-trigger="load, every 15s"
             hx-swap="innerHTML">
          <div class="h-10 rounded-md border border-ink-100 bg-white"></div>
        </div>
        <div id="schedule-strip"
             hx-get="/fragments/schedule-strip"
             hx-trigger="load, every 30s"
             hx-swap="innerHTML">
          <div class="h-10 rounded-md border border-ink-100 bg-white"></div>
        </div>
      </div>

      <main class="max-w-[1480px] mx-auto px-6 pb-12 pt-4">
        {% block content %}{% endblock %}
      </main>

      <footer class="text-xs text-ink-500 text-center py-4 border-t border-ink-100">
        dashboard_v3 · {{ version_str }} · server time {{ server_time_str }}
      </footer>
    </div>
  </div>

  <script src="{{ url_for('static', filename='new_event_badge.js') }}" defer></script>
</body>
</html>
