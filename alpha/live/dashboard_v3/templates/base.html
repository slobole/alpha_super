<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alpha Ops · {% block title %}Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='utilities.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='custom.css') }}">
</head>
<body class="client-workspace advanced-workspace">
  {% include "_side_rail.html" %}
  <div class="client-main">
    {% include "_top_bar.html" %}
    <main class="client-content">
      {% block content %}{% endblock %}
    </main>
    <footer class="client-footer">
      dashboard_v3 · {{ version_str }} · server time {{ server_time_str }}
    </footer>
  </div>
  <script src="{{ url_for('static', filename='new_event_badge.js') }}" defer></script>
  <script src="{{ url_for('static', filename='operator_actions.js') }}" defer></script>
</body>
</html>
