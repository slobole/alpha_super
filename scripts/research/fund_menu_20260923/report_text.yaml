title: "Fund product menu"
page_title: "Alpha Super Product Menu"
page_description: "Seven candidate fund portfolios built from all 25 PM_READY and WIRED sleeves with one rule frozen before any result, tested 2008–2026 against the current ladder, 60/40 and T-bills."

lede: >-
  Seven portfolios built from your 25 PM_READY and WIRED sleeves with one rule frozen before any result: a
  <strong>return bucket</strong> and a <strong>stabilizer bucket</strong>, mixed to a volatility target. From October 2012
  to August 2026 every product beat T-bills, matched or beat 60/40 with far less risk, and stayed inside its drawdown
  budget through 2008. This is a well-controlled backtest of sleeves designed on the same history: expect live results
  to be materially lower.

