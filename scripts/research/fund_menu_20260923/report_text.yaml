menu_intro_html: |
  <p>Two lines at three risk levels, plus Aggressive. The <strong>main line</strong> uses all seven engines, including daily mean reversion and the month-end flow. The <strong>low-touch line</strong> uses only sleeves that trade about three days a month or fewer, with no closing-auction orders.</p>
  <p>Card numbers cover October 2012 to August 2026 with a yearly reset; the second drawdown line reaches back to March 2008 through a stand-in sleeve.</p>

product_jobs:
  DEF: "Capital first. Anchored on CORE5, about 5% volatility. For money that should not fall more than about 10%."
  BAL: "Steady growth with a firm limit on bad years. About 8% volatility."
  GRO: "The return engines do most of the work, with CORE5 as ballast. About 11% volatility."
  LT_DEF: "The defensive rung with low-touch trading: CORE5 and tactical bonds plus a thin slice of momentum and the Nasdaq TAA."
  LT_BAL: "Balanced risk with six pods, trading on a few days a month."
  LT_GRO: "Growth risk on the simplest engine set. It matched the main line with smaller drawdowns."
  AGG: "Momentum and tactical allocation only, no stabilizers. For clients who accept deeper falls; offer on request."

amendment_card_notes:
  LT_DEF: 'Inflation Compass removed on 24 Sep 2026, the other pods scaled up pro rata: an owner decision taken after the results (<a href="#amendment-a1">amendment A1</a>).'

recommendation_html: |
  <div class="callout key">
    <h3>What I recommend</h3>
    <ul>
      <li><strong>Sell three risk levels, not seven strategies.</strong> Defensive, Balanced and Growth hold the same engines in different doses (neighbouring rungs correlate 0.92–0.997): one strategy family at three risk settings.</li>
      <li><strong>Launch on the low-touch line.</strong> Five or six monthly pods, no closing-auction orders, and almost no damage from cost stress (−0.3 to −0.4 points a year against −1.0 to −1.6 on the main line). It matches the main line at Balanced and Growth with smaller drawdowns and gives up about 2 points a year at Defensive.</li>
      <li><strong>Main-line Defensive is the best defensive book</strong> (10.6% a year, 5.4% volatility, −4.6% worst drawdown), but it needs closing-auction orders that are not wired (G-013).</li>
      <li><strong>Small defensive accounts need only two ETF pods:</strong> CORE5 + BTAL_QQQ returned 9.8% a year, fell −7.8% at worst including 2008, and needs about $20K (see <a href="#defensive">the defensive shelf</a>).</li>
      <li><strong>Aggressive replaces ladder 4 with four monthly pods</strong> (21.7% against 21.8%, drawdown −11.9% against −12.9%). Offer it on request: including 2008 its drawdown is −15%.</li>
      <li><strong>Simplify where it costs nothing.</strong> DV2 and Inflation Compass can go (Low-touch Defensive already dropped Inflation Compass, amendment A1). CORE5 alone beat a CORE5-plus-Trinity anchor. A 10% VIXM overlay is an option for crash-averse clients.</li>
      <li><strong>Before any money goes in:</strong> wire CORE5 and Tactical FI, re-freeze the Tactical FI fingerprint, keep the annual reset, and plan for live results well below these numbers.</li>
    </ul>
  </div>

performance_intro_html: |
  <p>Per line: growth of $1 and drawdowns on the exact window, and growth of $1 from March 2008. The long-window chart replaces the 3x BTAL TAA with its 2x no-BTAL sibling for the whole period, because BTAL only launched in 2011. After 2012 that stand-in fell further than the real sleeve in crashes (COVID −12% against −1%), so the long-window figures are conservative. All figures are net of each sleeve's modeled costs; idle cash earns 0%; books reset yearly.</p>

headline_table_note_html: >-
  Over T-bills = CAGR minus the 3-month T-bill CAGR. Sharpe uses a zero risk-free rate (house convention). Down capture =
  average return in the S&amp;P 500's down months divided by the S&amp;P's. The current ladders are rebuilt from the same sleeve
  runs, exactly as defined in <span class="mono">portfolios/ladder_*.yaml</span> (no reset).

crises_intro_html: |
  <p>Every S&amp;P 500 decline of 10% or more since March 2008, peak to trough, plus the 2013 taper tantrum. Long-window books, with the 2x stand-in TAA throughout.</p>

crises_note_html: >-
  Fast crashes hurt more than slow bear markets. In February 2018 the S&amp;P fell 10% in two weeks and Defensive lost 4.5%, its worst
  drawdown of the window; in slow declines (2008, 2022) the trend-gated sleeves step aside.

years_note_html: >-
  2008 starts in March. Every year uses the 2x no-BTAL TAA in place of the 3x BTAL sleeve. 2026 runs to 19 August.

construction_intro_html: |
  <p>Each product is one number, the <strong>share of capital in return engines</strong>, set so the book's expected volatility hits its target. Engines get equal capital, split 50/50 between two implementations when both clear a 5% minimum. Stabilizers are fixed: CORE5 half, then Tactical FI and month-end flow on the main line, or Tactical FI alone on the low-touch line. They take much of the capital but little of the risk: in Defensive, 67% of the money and about a third of the risk.</p>

construction_after_html: |
  <h4>Your two questions from the brief</h4>
  <p><strong>How much CORE5?</strong> It follows from the risk level: 33%, 18% and 9% on the main line; 55% (after A1), 35% and 19% on the low-touch line. CORE5 anchors the stabilizers because it is broad, trend-gated and nearly independent of stocks (beta 0.06, worst drawdown −6.8%). Swapping half of it for Trinity made Defensive worse (Sharpe 1.80 against 1.88).</p>
  <p><strong>NDX 25% versus MOSAIC 8%?</strong> They are one momentum engine (correlation 0.72), split 50/50. Reshuffling every split at random moved Growth's Sharpe only between 1.46 and 1.56: the split is not where the value is.</p>

method_html: |
  <div class="prose">
  <p>Every weight has a reason, and none was tuned to the backtest.</p>
  <ol>
    <li><strong>One data snapshot.</strong> All 25 sleeves rerun on the 2026-09-23 Norgate data to 19 August 2026, Tactical FI's frozen limit. Tactical FI and Crisis Trend use their governed saved runs.</li>
    <li><strong>Engines by mechanism.</strong> Seven: single-stock and ETF mean reversion, momentum, tactical allocation, multi-asset macro, tactical bonds and month-end flow. Correlation is only a check.</li>
    <li><strong>Representatives by written rules.</strong> Near-duplicates (correlation ≥ 0.90) keep one, WIRED first, then longer history. A second implementation only below 0.75. CORE5 anchors the stabilizers by your designation.</li>
    <li><strong>One discarded design.</strong> Pure risk budgeting was dropped on covariance alone: mostly idle sleeves looked "low risk" and absorbed the capital.</li>
    <li><strong>Two buckets, one dial.</strong> Return engines at equal capital, stabilizers at fixed shares, and one return share per product solved from a 5%, 7.5% or 10% volatility target. No expected return is used anywhere.</li>
    <li><strong>Freeze, then look.</strong> The spec was hashed (sha256 <span class="mono">b99d7937…</span>) before any book existed; the ledger records every step.</li>
    <li><strong>Amend in the open.</strong> Later owner decisions live in <span class="mono">amendments.yaml</span>: applied after the template, checked, logged and labelled. One so far: A1, Inflation Compass out of Low-touch Defensive.</li>
  </ol>
  <p>The low-touch line is defined by operations: at most about 36 trade days a year per sleeve and no closing-auction orders. That admits momentum, tactical allocation, CORE5 and Tactical FI.</p>
  </div>
