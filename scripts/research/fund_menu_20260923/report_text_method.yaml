engine_table_html: |
  <div class="table-wrap"><table>
  <thead><tr><th class="l">Engine</th><th class="l">What it earns</th><th class="l">Sleeves in the menu</th><th class="l">Bucket</th><th>Trades / yr</th></tr></thead>
  <tbody>
  <tr><td class="l"><span class="swatch" style="background:var(--e-1)"></span>Single-stock mean reversion</td><td class="l wrap-cell">Buys S&amp;P 500 stocks after sharp short-term drops inside an uptrend; exits on the rebound (days).</td><td class="l">HPI 2-3-5 vote, DV2</td><td class="l">Return</td><td>180–199</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-2)"></span>ETF mean reversion</td><td class="l wrap-cell">The same dip-buying on sector and industry ETFs; mostly in cash, in the market only after a shock.</td><td class="l">Sector ETF dips, industry dispersion</td><td class="l">Return</td><td>73–76</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-3)"></span>US equity momentum</td><td class="l wrap-cell">Monthly rotation into the strongest large-cap stocks per unit of volatility, off when the index is below its 200-day average.</td><td class="l">NDX VXN-scaled, MOSAIC R1000</td><td class="l">Return</td><td>10–13</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-4)"></span>Tactical allocation</td><td class="l wrap-cell">Monthly switching between risk assets and defensive assets by trend or macro regime.</td><td class="l">Nasdaq TAA (BTAL, 3x fallback), Inflation Compass</td><td class="l">Return</td><td>10–12</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-5)"></span>Multi-asset macro</td><td class="l wrap-cell">Five macro sleeves (stocks, Treasuries, gold, commodities, dollar), each held only in its uptrend, otherwise T-bills.</td><td class="l">CORE5</td><td class="l">Stabilizer (anchor)</td><td>29</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-6)"></span>Tactical bonds</td><td class="l wrap-cell">Holds 7–10y Treasuries when the curve is steep and corporate bonds when credit spreads are wide; T-bills otherwise.</td><td class="l">Tactical fixed income</td><td class="l">Stabilizer</td><td>6</td></tr>
  <tr><td class="l"><span class="swatch" style="background:var(--e-7)"></span>Month-end rebalancing flow</td><td class="l wrap-cell">Trades the predictable stock/bond flows of 60/40 funds rebalancing into month-end (long or short Treasuries).</td><td class="l">Month-end flow</td><td class="l">Stabilizer</td><td>34</td></tr>
  </tbody></table></div>

pod_floor_note_html: "Funding floors used for the smallest workable account: DV2 and HPI $25K each (repository rule); MOSAIC $40K and NDX $20K (our estimate for 20- and 10-name baskets at about $2K per name); $10K for every ETF sleeve (our estimate)."
