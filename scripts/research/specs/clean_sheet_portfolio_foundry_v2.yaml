robustness_contract:
  equal_observation_third_count_int: 3
  minimum_passing_third_count_int: 2
  maximum_third_cagr_shortfall_vs_reference_float: 0.03
  maximum_third_max_drawdown_worsening_float: 0.03
  crisis_windows_str: repository_standard
  leave_one_sleeve_out_str: conditional_phase2_only_replace_removed_weight_with_bil
  leave_one_sleeve_out_is_selectable_bool: false

crisis_diagnostic_list:
  - [gfc_2008, "2008-09-15", "2009-03-09"]
  - [european_debt_2011, "2011-08-01", "2011-10-04"]
  - [china_oil_shock_2015, "2015-08-18", "2016-02-11"]
  - [volmageddon, "2018-02-02", "2018-02-09"]
  - [covid_crash, "2020-02-20", "2020-04-07"]
  - [inflation_bear_2022, "2022-01-03", "2022-10-12"]
  - [trump_tariffs_2025, "2025-02-01", "2025-04-30"]

statistical_contract:
  bootstrap_type_str: synchronized_paired_stationary
  bootstrap_iteration_count_int: 10000
  bootstrap_chunk_size_int: 250
  random_seed_int: 20260830
  annualization_day_int: 252
  es_quantile_float: 0.05
  primary_mean_block_length_int: 63
  sensitivity_mean_block_length_list: [21, 126]
  maximum_holm_adjusted_p_value_float: 0.10
  minimum_primary_composite_success_probability_float: 0.60
  minimum_sensitivity_composite_success_probability_float: 0.55
  holm_family_candidate_id_list:
    - C1_foundry_defensive
    - C2_foundry_balanced
    - C3_foundry_growth
    - C4_foundry_low_touch
  historical_trial_count_floor_int: 60
  current_candidate_count_added_to_historical_floor_bool: true
  historical_trial_adjustment_method_str: bonferroni_floor_then_holm
  pure_untouched_holdout_claim_allowed_bool: false

lineage_contract:
  fail_if_registry_changes_bool: true
  fail_if_strategy_code_changes_during_run_bool: true
  fail_if_shared_execution_code_changes_during_run_bool: true
  norgate_fingerprint_at_start_source_end_and_final_bool: true
  fail_if_norgate_fingerprint_changes_bool: true
  manifest_hash_every_artifact_bool: true

capacity_contract:
  phase1_capacity_gate_bool: false
  capacity_evidence_required_in_separate_preregistered_phase_bool: true

stop_rule:
  if_candidate_fails_str: reject_candidate_without_weight_tuning
  maximum_authority_on_full_pass_str: frozen_candidate_to_forward_shadow_only
  no_live_paper_release_or_allocation_changes_bool: true
