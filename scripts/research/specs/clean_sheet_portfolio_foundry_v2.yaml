study_id_str: clean_sheet_portfolio_foundry_v2
study_version_str: "2.0"
frozen_date_str: "2026-08-30"
supersedes_failed_spec_str: >-
  v1 stopped before portfolio analysis because sector_mr maps a 2012-09-28
  engine request to its first realized result on 2012-10-01.
research_authority_str: research_and_bench_only
allocation_authority_bool: false
paper_authority_bool: false
live_authority_bool: false

research_question_str: >-
  Which economically distinct portfolios should be built from the full WIRED
  and PM_READY strategy registry for defensive, balanced, growth, and low-touch
  objectives, without optimizing weights on realized returns?

construction_doctrine:
  selection_basis_str: mechanism_maturity_history_and_nonduplication_before_results
  full_sample_optimizer_allowed_bool: false
  markowitz_allowed_bool: false
  hrp_or_risk_parity_as_selection_authority_bool: false
  outer_rebalance_str: none_independently_compounded_pods
  candidate_weight_search_count_int: 0
  weights_are_fixed_capital_budgets_bool: true
  ladders_are_external_references_not_construction_seeds_bool: true

registry_contract:
  expected_wired_count_int: 9
  expected_pm_ready_count_int: 13
  expected_promoted_count_int: 22
  selected_strategy_by_alias:
    dv2:
      strategy_import_str: strategies.dv2.strategy_mr_dv2:DVO2Strategy
      tier_str: WIRED
      family_str: single_stock_mean_reversion
      cadence_str: daily_signal
      native_history_request_start_date_str: "1998-01-01"
    hpi:
      strategy_import_str: strategies.hpi.strategy_mr_hpi_sp500_2_3_5_vote
      tier_str: WIRED
      family_str: single_stock_mean_reversion
      cadence_str: daily_signal
      native_history_request_start_date_str: "1998-01-01"
    ndx:
      strategy_import_str: strategies.momentum.strategy_mo_atr_normalized_ndx_vxn_scaled:VxnScaledAtrNormalizedNdxStrategy
      tier_str: WIRED
      family_str: equity_momentum
      cadence_str: monthly_signal
      native_history_request_start_date_str: "1999-01-01"
    mosaic:
      strategy_import_str: strategies.momentum.strategy_mo_mosaic_russell1000:MosaicRussell1000Strategy
      tier_str: PM_READY
      family_str: equity_momentum
      cadence_str: monthly_signal
      native_history_request_start_date_str: "1999-01-01"
    taa_growth:
      strategy_import_str: strategies.taa_df.strategy_taa_df_btal_fallback_tqqq_vix_cash
      tier_str: WIRED
      family_str: defense_first_growth_taa
      cadence_str: monthly_signal
      native_history_request_start_date_str: "2000-01-01"
    taa_defensive:
      strategy_import_str: strategies.taa_df.strategy_taa_df_btal_linearity_1n_fallback_qqq_vix_cash
      tier_str: WIRED
      family_str: defense_first_linearity_taa
      cadence_str: monthly_signal
      native_history_request_start_date_str: "2000-01-01"
    sector_mr:
      strategy_import_str: strategies.mean_reversion.strategy_mr_us_sector_etf_ibs_downshock_vox_iyr
      tier_str: PM_READY
      family_str: sector_etf_mean_reversion
      cadence_str: daily_signal
      native_history_request_start_date_str: "1998-01-01"
      engine_request_start_date_str: "2012-09-28"
    core5:
      strategy_import_str: strategies.taa_beyond_6040.strategy_taa_adaptive_macro_core5
      tier_str: PM_READY
      family_str: adaptive_macro
      cadence_str: state_change_and_month_end
      native_history_request_start_date_str: "1990-01-01"
    trinity:
      strategy_import_str: strategies.taa_beyond_6040.strategy_taa_trinity_vol_control_8_bil
      tier_str: PM_READY
      family_str: multi_asset_volatility_control
      cadence_str: volatility_band_and_month_end
      native_history_request_start_date_str: "1995-01-01"
    tactical_fi:
      strategy_import_str: strategies.taa_beyond_6040.strategy_taa_tactical_fixed_income_ief_lqd
      tier_str: PM_READY
      family_str: tactical_fixed_income
      cadence_str: monthly_signal
      native_history_request_start_date_str: "2002-07-26"

  excluded_promoted_strategy_list:
    - strategy_import_str: strategies.qpi.strategy_mr_qpi_ibs_rsi_exit:QPIIbsRsiExitStrategy
      reason_str: duplicate_single_stock_mean_reversion_trade_relative_to_selected_hpi
    - strategy_import_str: strategies.hpi.strategy_mr_hpi_sp500_ibs_rsi_exit
      reason_str: superseded_within_hpi_family_by_selected_vote_variant
    - strategy_import_str: strategies.momentum.strategy_mo_atr_normalized_ndx:AtrNormalizedNdxStrategy
      reason_str: same_momentum_engine_without_selected_vxn_risk_scaler
    - strategy_import_str: strategies.taa_df.strategy_taa_df_btal_1n_fallback_tqqq_vix_cash
      reason_str: higher_risk_same_taa_family_not_needed_for_v1_product_objectives
    - strategy_import_str: strategies.taa_df.strategy_taa_df_1n_fallback_qld_vix_cash
      reason_str: no_btal_2008_proxy_reserved_for_phase2_history_sensitivity
    - strategy_import_str: strategies.taa_df.strategy_taa_df_1n_fallback_sso_vix_cash
      reason_str: same_taa_family_proxy_reserved_for_phase2
    - strategy_import_str: strategies.taa_df.strategy_taa_df_btal_1n_fallback_qld_vix_cash
      reason_str: same_taa_family_2x_duplicate
    - strategy_import_str: strategies.taa_df.strategy_taa_df_linearity_1n_fallback_qqq_vix_cash
      reason_str: no_btal_2008_proxy_reserved_for_phase2_history_sensitivity
    - strategy_import_str: strategies.mean_reversion.strategy_mr_sector_dispersion_ibs_kie_ihi_xlc
      reason_str: short_post_2018_history_and_same_sector_mean_reversion_bucket
    - strategy_import_str: strategies.mean_reversion.strategy_mr_sector_dispersion_ibs_kie_ihi_xlc_asset_sma200
      reason_str: short_post_2019_history_and_same_sector_mean_reversion_bucket
    - strategy_import_str: strategies.mean_reversion.strategy_mr_sector_dispersion_ibs_kie_ihi_asset_sma200
      reason_str: same_sector_mean_reversion_bucket_reserved_as_phase2_challenger
    - strategy_import_str: strategies.taa_df.strategy_taa_inflation_compass
      reason_str: prior_ladder_value_add_rejection_and_current_vintage_fred_gap

portfolio_contract:
  capital_base_float: 1000000.0
  requested_start_date_str: "2004-01-01"
  capital_anchor_date_str: "2012-09-28"
  effective_execution_start_date_str: "2012-10-01"
  end_date_str: "2026-08-28"
  benchmark_symbol_str: "$SPXTR"
  benchmark_adjustment_str: TOTALRETURN
  whole_shares_bool: true
  source_native_costs_unchanged_bool: true
  positive_cash_rate_policy_str: strategy_native
  negative_cash_financing_policy_str: unmodeled_and_gate_blocking
  exact_global_intersection_bool: true
  missing_value_fill_allowed_bool: false

