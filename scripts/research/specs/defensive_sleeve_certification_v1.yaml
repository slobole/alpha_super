study_id_str: defensive_sleeve_certification_v1
study_version_str: "1.0"
frozen_date_str: "2026-08-30"
authority_str: research_bench_only
allocation_authority_bool: false
paper_authority_bool: false
live_authority_bool: false
evidence_status_str: historically_conditioned_after_preregistered_phase0

study_window:
  requested_history_start_date_str: "2004-01-01"
  capital_anchor_date_str: "2012-09-28"
  effective_execution_start_date_str: "2012-10-01"
  frozen_end_date_str: "2026-08-19"
  comparison_index_str: exact_intersection_of_every_source_and_benchmark
  missing_value_policy_str: reject_no_fill_no_forward_fill_no_zero_return
  anchor_return_policy_str: >-
    first_result_includes_cash_anchor_to_first_post_Open_T_plus_1_close

research_question_str: >-
  Can a fixed defensive sleeve earn more than 4% nominal net CAGR while
  remaining defensive enough to receive 75% of a client portfolio whose other
  25% is the frozen Growth 4 portfolio?

product_mandate:
  primary_label_str: defensive_return
  capital_preservation_label_requires_separate_gate_bool: true
  user_minimum_nominal_net_cagr_float: 0.04
  initial_growth4_weight_float: 0.25
  initial_defensive_weight_float: 0.75
  primary_outer_rebalance_str: none_independently_compounded_accounts
  annual_reset_sensitivity_bool: false
  annual_reset_deferred_reason_str: >-
    external capital transfer timing state preservation and transfer costs are
    not yet defined; it cannot be inferred from daily weighted returns
  research_capital_base_float: 1000000.0
  exact_client_aum_float: null
  exact_client_aum_required_for_capacity_signature_bool: true
  product_fee_schedule: null
  product_fee_schedule_required_for_final_net_signature_bool: true

construction_doctrine:
  full_sample_optimizer_allowed_bool: false
  markowitz_allowed_bool: false
  risk_parity_as_selection_authority_bool: false
  weight_search_count_int: 0
  adjacent_weight_search_after_failure_allowed_bool: false
  candidate_selection_basis_str: mechanism_diversification_simplicity_and_known_maturity
  whole_shares_bool: true
  decision_execution_timing_str: Close_T_to_Open_T_plus_1
  missing_return_fill_allowed_bool: false
  full_product_value_formula_str: V_product_t_equals_sum_of_independent_account_values_t
  full_product_return_formula_str: V_product_t_div_V_product_t_minus_1_minus_1

execution_data_contract:
  order_policy_str: strategy_native_next_open_MOO_research_proxy
  signal_cutoff_str: strategy_native_Close_T_or_documented_month_end_cutoff
  point_in_time_membership_required_for_growth4_stock_sleeves_bool: true
  stock_and_etf_execution_mark_adjustment_str: CAPITALSPECIAL
  benchmark_adjustment_str: TOTALRETURN
  explicit_dividend_cash_ledger_required_bool: true
  norgate_vintage_fingerprint_at_start_source_end_and_final_bool: true
  norgate_vintage_change_is_hard_stop_bool: true
  hash_growth4_yaml_nested_strategy_modules_and_shared_execution_tree_bool: true
  lifecycle_last_available_close_is_diagnostic_and_must_be_counted_bool: true

strategy_aliases:
  growth4:
    config_path_str: portfolios/ladder_4_growth.yaml
    role_str: frozen_client_growth_book
  core5:
    strategy_import_str: strategies.taa_beyond_6040.strategy_taa_adaptive_macro_core5
    role_str: defensive_anchor
  tactical_fi:
    strategy_import_str: strategies.taa_beyond_6040.strategy_taa_tactical_fixed_income_ief_lqd
    role_str: low_correlation_fixed_income_diversifier
  trinity:
    strategy_import_str: strategies.taa_beyond_6040.strategy_taa_trinity_vol_control_8_bil
    role_str: higher_return_defensive_diversifier
  bil:
    strategy_import_str: strategies.portfolio_controls.strategy_passive_bil
    role_str: matched_cash_alternative
  passive_20_80:
    role_str: passive_defensive_context_only
    weight_by_asset:
      SPY: 0.20
      IEF: 0.80

exclusions_from_v1:
  sector_mr_str: equity_risk_turnover_and_capacity_are_not_needed_in_first_defensive_pass
  taa_defensive_str: overlap_with_growth4_and_core5_is_too_high_for_first_pass
  core5_parameter_changes_str: source_rule_tuning_is_out_of_scope

defensive_sleeve_controls:
  B0_bil:
    label_str: capital_preservation_control
    weight_by_alias:
      bil: 1.0
  B1_core5:
    label_str: active_anchor
    weight_by_alias:
      core5: 1.0
  B2_passive_20_80:
    label_str: passive_defensive_return_context
    weight_by_alias:
      passive_20_80: 1.0

defensive_sleeve_candidates:
  CP1_core5_bil:
    requested_label_str: capital_preservation
    weight_by_alias:
      core5: 0.50
      bil: 0.50
  CP2_core5_tfi_bil:
    requested_label_str: capital_preservation
    weight_by_alias:
      core5: 0.50
      tactical_fi: 0.25
      bil: 0.25
  DR1_core5_tfi_trinity:
    requested_label_str: defensive_return
    weight_by_alias:
      core5: 0.50
      tactical_fi: 0.25
      trinity: 0.25

full_product_controls:
  P0_growth4_bil:
    growth4_weight_float: 0.25
    defensive_control_id_str: B0_bil
    defensive_weight_float: 0.75
  P1_growth4_core5:
    growth4_weight_float: 0.25
    defensive_control_id_str: B1_core5
    defensive_weight_float: 0.75
  P2_growth4_passive_20_80:
    growth4_weight_float: 0.25
    defensive_control_id_str: B2_passive_20_80
    defensive_weight_float: 0.75

