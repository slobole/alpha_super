    full_product:
      minimum_net_cagr_float: 0.04
      maximum_absolute_max_drawdown_float: 0.10
      maximum_annualized_volatility_float: 0.085
      maximum_market_beta_float: 0.30
      maximum_daily_es5_loss_float: 0.015
      minimum_worst_21d_return_float: -0.07
      minimum_worst_252d_return_float: -0.10
      minimum_all_rolling_756d_cagr_float: 0.0
      maximum_underwater_session_count_int: 504
      maximum_downside_beta_float: 0.35
  defensive_return:
    sleeve:
      minimum_net_cagr_float: 0.04
      maximum_absolute_max_drawdown_float: 0.12
      maximum_annualized_volatility_float: 0.09
      maximum_market_beta_float: 0.30
      maximum_daily_es5_loss_float: 0.0175
      minimum_worst_21d_return_float: -0.08
      minimum_worst_252d_return_float: -0.12
      minimum_all_rolling_756d_cagr_float: 0.0
      maximum_underwater_session_count_int: 756
      maximum_downside_beta_float: 0.50
    full_product:
      minimum_net_cagr_float: 0.04
      maximum_absolute_max_drawdown_float: 0.12
      maximum_annualized_volatility_float: 0.105
      maximum_market_beta_float: 0.40
