      minimum_worst_21d_return_float: -0.09
      minimum_worst_252d_return_float: -0.15
      minimum_all_rolling_756d_cagr_float: 0.0
      maximum_underwater_session_count_int: 756
      maximum_downside_beta_float: 0.50

relative_gates:
  minimum_full_product_net_cagr_delta_vs_P0_float: 0.005
  maximum_full_product_max_drawdown_worsening_vs_P0_by_label:
    capital_preservation: 0.03
    defensive_return: 0.06
  CP_minimum_sleeve_max_drawdown_improvement_vs_core5_float: 0.01
  CP_minimum_sleeve_worst_252d_improvement_vs_core5_float: 0.01
  DR_minimum_sleeve_cagr_improvement_vs_core5_float: 0.005
  DR_alternative_minimum_sharpe_improvement_vs_core5_float: 0.10
  DR_maximum_sleeve_max_drawdown_worsening_vs_core5_float: 0.01
  maximum_each_crisis_full_product_max_drawdown_worsening_vs_P1_float: 0.01

robustness_contract:
  equal_observation_third_count_int: 3
  positive_cagr_required_in_every_third_bool: true
  minimum_thirds_above_four_percent_cagr_int: 2
  risk_cap_required_in_every_third_bool: true
  rolling_window_session_list: [21, 63, 126, 252, 756]
  crisis_window_list:
    - [china_oil_shock_2015, "2015-08-18", "2016-02-11"]
    - [volmageddon, "2018-02-02", "2018-02-09"]
    - [covid_crash, "2020-02-20", "2020-04-07"]
    - [inflation_bear_2022, "2022-01-03", "2022-10-12"]
    - [trump_tariffs_2025, "2025-02-01", "2025-04-30"]
  pre_2012_crisis_replay_is_diagnostic_only_bool: true
  crisis_maximum_full_product_absolute_drawdown_by_label:
    capital_preservation: 0.10
    defensive_return: 0.12
  every_crisis_gate_must_pass_individually_bool: true
  causal_regime_list:
    - spxtr_above_below_sma200
    - ief_trailing_126d_positive_negative
    - vix_at_least_25
    - dgs3mo_lagged_below_1_between_1_3_above_3
  minimum_regime_observation_count_int: 252
  insufficient_regime_sample_policy_str: diagnostic_only_cannot_pass_or_fail
  minimum_positive_equity_rate_quadrant_count_int: 3
  maximum_2022_sleeve_loss_by_label:
    capital_preservation: 0.03
    defensive_return: 0.05
  causal_regime_definition:
    spxtr_above_below_sma200:
      input_str: SPXTR_TOTALRETURN_Close_T
      formula_str: Close_T_greater_than_SMA200_including_T
      classified_return_str: product_return_Open_T_plus_1_to_Close_T_plus_1
    ief_trailing_126d_positive_negative:
      input_str: IEF_TOTALRETURN_Close_T
      formula_str: Close_T_div_Close_T_minus_126_minus_1
      classified_return_str: product_return_Open_T_plus_1_to_Close_T_plus_1
    vix_at_least_25:
      input_str: VIX_Close_T
      formula_str: VIX_Close_T_greater_than_or_equal_to_25
      classified_return_str: product_return_Open_T_plus_1_to_Close_T_plus_1
    dgs3mo_lagged_below_1_between_1_3_above_3:
      input_str: frozen_FRED_DGS3MO_observation
      publication_rule_str: first_trading_session_after_17_15_ET_cutoff
      buckets_pct_list: [1.0, 3.0]
      classified_return_str: product_return_after_publication_availability

statistical_contract:
  paired_stationary_bootstrap_bool: true
  bootstrap_iteration_count_int: 10000
  bootstrap_chunk_size_int: 250
  random_seed_int: 20260830
  synchronized_candidate_control_resampling_bool: true
  stationary_bootstrap_algorithm_str: geometric_block_restart_probability_one_over_mean_block_length
  primary_mean_block_length_int: 63
  sensitivity_mean_block_length_list: [21, 126]
  primary_joint_gate_probability_float: 0.60
  sensitivity_joint_gate_probability_float: 0.55
  multiple_comparison_method_str: holm_after_historical_trial_floor
  holm_familywise_alpha_float: 0.10
  candidate_family_list: [CP1_core5_bil, CP2_core5_tfi_bil, DR1_core5_tfi_trinity]
  historical_trial_count_floor_int: 67
  historical_trial_floor_derivation_str: 60_prior_floor_plus_4_foundry_candidates_plus_3_current_candidates
  raw_p_value_definition_str: >-
    one_sided paired bootstrap probability that candidate fails its frozen
    joint absolute and relative gate versus matched controls
  joint_gate_statistic_str: all_frozen_absolute_relative_and_subperiod_gates_pass_on_same_bootstrap_path
  pure_untouched_holdout_claim_allowed_bool: false
  rolling_756_effective_window_count_must_be_reported_bool: true

accounting_financing_contract:
  harmonized_accounting_required_bool: true
  dividend_withholding_rate_float: 0.25
  investor_tax_modeled_bool: false
  positive_cash_policy_str: causal_DGS3MO_ACT_365
  negative_cash_policy_str: benchmark_plus_spread
  negative_cash_base_spread_bps_float: 200.0
  negative_cash_stress_total_spread_bps_list: [200.0, 500.0]
  client_actual_negative_cash_spread_required_for_final_signature_bool: true
  maximum_unmodeled_negative_cash_day_count_int: 0
  core5_dbc_borrow_base_pct_float: 1.0
  core5_dbc_borrow_stress_pct_list: [3.0, 5.0, 10.0]
  core5_no_short_survival_required_bool: true
  daily_account_borrow_locate_recall_evidence_required_for_final_signature_bool: true
  tactical_fi_fred_vintage_str: current_vintage_not_alfred
  source_native_cost_contract:
    core5:
      slippage_per_side_bps_float: 2.5
      commission_per_share_float: 0.005
      commission_minimum_float: 1.0
      dividend_withholding_rate_float: 0.25
      positive_cash_rate_policy_str: zero_percent_intentional
    bil_core5_matched:
      slippage_per_side_bps_float: 2.5
      commission_per_share_float: 0.005
      commission_minimum_float: 1.0
      dividend_withholding_rate_float: 0.25
      positive_cash_rate_policy_str: zero_percent_intentional
    tactical_fi:
      slippage_per_side_bps_float: 5.0
      commission_per_share_float: 0.0
      commission_minimum_float: 0.0
      dividend_withholding_rate_float: 0.0
      positive_cash_rate_policy_str: causal_DGS3MO_ACT_365
    trinity:
      slippage_per_side_bps_float: 1.0
      commission_per_share_float: 0.005
      commission_minimum_float: 1.0
      dividend_withholding_rate_float: 0.25
      positive_cash_rate_policy_str: zero_percent_intentional
  accounting_compatibility_gate_str: >-
    candidate cannot pass until every component is rerun under one offered
    account contract or a source-literal matched-control comparison proves
    that accounting differences cannot drive the decision

capacity_contract:
  phase_two_after_non_capacity_pass_bool: true
  exact_client_aum_required_bool: true
  aggregate_same_day_symbol_orders_across_full_product_bool: true
  maximum_p95_order_adv_ratio_float: 0.0005
  maximum_p99_order_adv_ratio_float: 0.001
  maximum_overall_and_rolling_3y_sharpe_erosion_fraction_float: 0.20
  minimum_post_impact_net_cagr_float: 0.04
  recommended_capacity_must_cover_client_aum_bool: true
  dbc_borrow_capacity_is_separate_from_etf_adv_bool: true
  prior_core5_capacity_artifact_is_context_only_bool: true

stop_rule:
  if_all_candidates_fail_str: reject_without_adjacent_weight_search
  maximum_phase_one_authority_str: frozen_candidate_to_forward_shadow_only
  final_ready_signature_requires_non_capacity_capacity_fees_and_borrow_gates_bool: true
  no_live_paper_release_or_allocation_changes_bool: true
