    H4: results/research/portfolio/ladder4_candidate_capacity_exact/2026-08-29_h0_h8/H4/summary.json
  prior_artifact_by_strategy:
    tactical_fixed_income: results/research/strategy/strategy_taa_tactical_fixed_income_ief_lqd/capacity_analysis/2026-08-20_215559/summary.json
