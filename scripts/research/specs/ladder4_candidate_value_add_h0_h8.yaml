capacity_contract:
  gate_str: phase_1_never_clears_capacity_separate_preregistered_phase_2_required
  book_level_order_overlap_str: aggregate_actual_same_day_same_symbol_transactions_diagnostic_only
  current_evidence_status_str: not_cleared_period_mismatch_and_null_recommended_capacity
  exact_rerun_policy_str: required_only_if_all_non_capacity_promotion_gates_pass
  current_study_capacity_gate_must_remain_false_bool: true
  external_artifact_can_clear_current_study_bool: false
  phase_2_contract_must_be_frozen_before_capacity_data_review_bool: true
  phase_2_minimum_requirement_list:
    - Dedicated deterministic builder must generate lineage and detailed artifacts directly.
    - Candidate identity, strategy code, analyzer code, period, capital grid, and Norgate data panel must be hashed.
    - Raw pass conditions must be recomputed from numeric liquidity, impact, Sharpe erosion, rolling erosion, and cost fields.
    - Every tested AUM must have strategy-matched assessed order diagnostics and finite nonnegative liquidity inputs.
    - Baseline slippage must be family specific: Tactical Fixed Income 5bps and CORE5 2.5bps per side.
    - Phase 2 cannot change H0-H8 economics, candidates, weights, or statistical results.
  exact_artifact_path_by_candidate:
    H1: results/research/portfolio/ladder4_candidate_capacity_exact/2026-08-29_h0_h8/H1/summary.json
    H2: results/research/portfolio/ladder4_candidate_capacity_exact/2026-08-29_h0_h8/H2/summary.json
