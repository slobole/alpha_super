# Monthly Defensive (NDX variant) — comparison candidate, not yet a product.
#
# Same as monthly_defensive.yaml but the third pod is the WIRED VXN-scaled NDX
# ATR-momentum instead of taa_beyond_6040_inverse_vol. Trade-offs vs the base:
#   + all-WIRED except EOM pod; higher expected return; monthly rotation.
#   - NDX pod is single-stock (10 names -> ~10 tx/month, needs more capital),
#     vol 17.2% / MaxDD -23.2% standalone, and 0.52 daily-return correlation
#     to the linearity-QQQ pod (both Nasdaq-beta) — more growth-concentrated.
#
# Pickles pinned explicitly; buy-and-hold pod compounding (house default).

name: MonthlyDefensiveNdx
capital: 100000
# PM benchmark for report attribution: $SPX (TOTALRETURN) is stored in the TAA
# pod's results; the EOM pod stores SPY, so auto-derivation would refuse to pick.
benchmark: $SPX

pods:
  - strategy: strategy_taa_df_btal_linearity_1n_fallback_qqq_vix_cash
    weight: 0.4

  - strategy: strategy_eom_zroz_spy_sso_variant_research
    weight: 0.4

  - strategy: strategy_mo_atr_normalized_ndx_vxn_scaled
    weight: 0.2
