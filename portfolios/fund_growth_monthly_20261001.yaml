# Kept from the 2026-10-01 fund-products study as the monthly-only growth book: the book that can run before
# the capsule conditions hold and the scalable alternative (docs/research/FUND_PRODUCTS_20261005.md).
# GROWTH, launch (no leverage): taa_btal_1n_tqqq 38.4% / ndx_vxn 25.6% / core5 18.0% / taa_btal_lin_qqq 18.0%.
# Study (LONG 2008-03..2026-08, gross): 18.1%/yr, max DD -13.1%, excess Sharpe 1.14, P(DD < -10%) 100.0%, P(DD < -20%) 11.4%.
# Source: fund products study, amendments A6 / A6-c / A6-d (2026-10-01), scripts/research/fund_products_20260930/a6.py, a6d.py.
# Research configuration only: not an allocation approval and not wired to LIVE. Simulation, before fees.
# Starts 2012-10-02 (TQQQ/BTAL real history); the study's 2008 proxy is not used by the bench.
name_str: fund_growth_monthly_20261001
capital_base_float: 1000000.0
backtest_start_date_str: '2012-10-02'
end_date_str: null
allocation_policy_str: fixed
max_workers_int: null
rebalance:
  frequency_str: annually
  policy_str: fixed
save_pod_artifacts_bool: true
regression_benchmark_symbol_str: $SPX
pods:
- pod_id_str: pod_taa_btal_1n_tqqq
  strategy_import_str: strategies.taa_df.strategy_taa_df_btal_1n_fallback_tqqq_vix_cash
  weight_float: 0.384
- pod_id_str: pod_ndx_vxn
  strategy_import_str: strategies.momentum.strategy_mo_atr_normalized_ndx_vxn_scaled:VxnScaledAtrNormalizedNdxStrategy
  weight_float: 0.256
- pod_id_str: pod_core5
  strategy_import_str: strategies.taa_beyond_6040.strategy_taa_adaptive_macro_core5
