# Converted from the simple (combine-pickles) schema to the manager schema on
# 2026-07-31 so the Bench Run button executes a fresh run per pod.
#
# *** CAPITAL FLOOR WARNING *** DV2 and HPI each require $25,000 of allocated
# sleeve capital. At 0.1097 weight that needs total capital >= ~$227,900, so
# the manager will refuse to start this book at $100,000. Raise
# capital_base_float or the two weights before running.
name_str: temp5
capital_base_float: 100000.0
backtest_start_date_str: "2004-01-01"
end_date_str: null
allocation_policy_str: fixed
max_workers_int: null
rebalance: null
save_pod_artifacts_bool: true

pods:
  - pod_id_str: pod_sector_dispersion_kie_ihi_xlc
    strategy_import_str: strategies.mean_reversion.strategy_mr_sector_dispersion_ibs_kie_ihi_xlc
    weight_float: 0.1097

  - pod_id_str: pod_taa
    strategy_import_str: strategies.taa_df.strategy_taa_df_btal_fallback_tqqq_vix_cash
    weight_float: 0.3389

  - pod_id_str: pod_ndx_mo
    strategy_import_str: strategies.momentum.strategy_mo_atr_normalized_ndx_vxn_scaled:VxnScaledAtrNormalizedNdxStrategy
    weight_float: 0.332

  - pod_id_str: pod_hpi
    strategy_import_str: strategies.hpi.strategy_mr_hpi_sp500_2_3_5_vote
    weight_float: 0.1097

  - pod_id_str: pod_dv2
    strategy_import_str: strategies.dv2.strategy_mr_dv2:DVO2Strategy
    weight_float: 0.1097
