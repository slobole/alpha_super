<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אסטרטגיית מצפן האינפלציה</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;family=Noto+Sans+Hebrew:wght@400;500;600&amp;family=Noto+Serif+Hebrew:wght@400;500&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --accent-tint: rgba(235, 108, 54, 0.08);
      --rule: rgba(45, 49, 66, 0.12);
      --sans: 'Noto Sans Hebrew', 'Geist', Arial, sans-serif;
      --serif: 'Noto Serif Hebrew', 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame { width: 100%; max-width: 1280px; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      font-family: var(--serif);
      font-size: 32px;
      font-weight: 400;
      line-height: 1.2;
    }
    .subtitle {
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    .hebrew { font-family: var(--sans); }
    .technical { font-family: var(--mono); direction: ltr; unicode-bidi: embed; }
    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      color: var(--soft);
      font-family: var(--mono);
      font-size: 8px;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">FLOWCHART · INFLATION COMPASS</p>
    <h1>איך מצפן האינפלציה בוחר את הנכס לחודש הבא?</h1>
    <p class="subtitle">שתי שאלות בינאריות יוצרות ארבעה משטרים. ההחלטה מתקבלת בסגירת סוף החודש, והאיזון מתבצע בפתיחת יום המסחר הראשון בחודש הבא.</p>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>

      <path d="M640 88 V120" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <path d="M540 176 H408 Q400 176 400 184 V272" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="456" y="148" width="40" height="16" rx="4" fill="#f5f5f5"/>

      <path d="M740 176 H872 Q880 176 880 184 V272" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <text x="512" y="372" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">לא</text>

      <path d="M780 328 H792 Q800 328 800 336 V424" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="736" y="360" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="752" y="372" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">כן</text>

      <rect x="1016" y="360" width="32" height="16" rx="4" fill="#f5f5f5"/>
      <text x="1032" y="372" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">לא</text>

      <path d="M280 488 V548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M480 488 V548" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Input node. -->
      <rect x="460" y="24" width="360" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="460" y="24" width="360" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="640" y="52" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" class="hebrew">נתוני סוף החודש</text>
      <text x="640" y="72" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">SPY + sector ETFs + FRED T5YIE</text>

      <text x="640" y="200" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">AND (T5YIE &gt; T−60 OR slope60 &gt; 0)</text>

      <polygon points="880,272 980,328 880,384 780,328" fill="#f5f5f5"/>

      <text x="880" y="340" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">SPY_T &gt; SMA200_T</text>

      <!-- Allocation outcomes. -->

      <rect x="188" y="432" width="56" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="216" y="444" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">UP + ON</text>

      <text x="280" y="480" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">אנרגיה</text>

      <rect x="380" y="424" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="380" y="424" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="388" y="432" width="72" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="424" y="444" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">DOWN + ON</text>
      <text x="480" y="464" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" class="technical">100% XLU</text>
      <text x="480" y="480" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">תשתיות</text>

      <rect x="700" y="424" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="700" y="424" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="708" y="432" width="64" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="740" y="444" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">UP + OFF</text>
      <text x="800" y="464" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" class="technical">100% XLK</text>
      <text x="800" y="480" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">טכנולוגיה</text>

      <rect x="900" y="424" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="900" y="424" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="908" y="432" width="80" height="16" rx="4" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="948" y="444" fill="#4f5d75" font-size="8" text-anchor="middle" class="technical">DOWN + OFF</text>
      <text x="1000" y="464" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" class="technical">50% XLP + 50% IEF</text>
      <text x="1000" y="480" fill="#4f5d75" font-size="8" text-anchor="middle" class="hebrew">צריכה בסיסית + אג״ח</text>

      <rect x="160" y="548" width="960" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="548" width="960" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="640" y="576" fill="#2d3142" font-size="12" font-weight="600" text-anchor="middle" class="hebrew">החזקה ישנה עד פתיחת החודש הבא — ואז איזון לתיק החדש</text>

    <p class="footer">CURRENT-VINTAGE FRED · TOTALRETURN SIGNALS · CAPITALSPECIAL EXECUTION · CASH-CONSTRAINT NOT MODELED</p>

</html>
